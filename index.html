       <span>المعلمة: <strong id="tmpl-teacher"></strong></span> <span>المادة: <strong id="tmpl-subject"></strong></span> <span>التاريخ: <strong id="tmpl-date"></strong></span>

  <script src="/_sdk/c6bcadf20ce5820f.editing_sdk.js" integrity="sha512-LVukVCTKnKSxy98w+wCVzDAxVXBG2vy32XblXlmJD9CPFnF2/FVc75CFngl41IdXcX3sVHJc9olw64zrPM/FIA=="></script>
  <script>
        let selectedStrategy = null;
        const strategyCards = document.querySelectorAll('[data-strategy]');
        const generateBtn = document.getElementById('generate-btn');

        strategyCards.forEach(card => {
            card.addEventListener('click', () => {
                strategyCards.forEach(c => c.classList.remove('selected'));
                card.classList.add('selected');
                selectedStrategy = card.dataset.strategy;
                generateBtn.disabled = false;
            });
        });

        document.getElementById('main-form').addEventListener('submit', e => {
            e.preventDefault();
            const teacher = document.getElementById('teacher-name').value.trim();
            const subject = document.getElementById('subject-name').value.trim();
            if (!teacher || !subject || !selectedStrategy) return;
            generateTemplate(teacher, subject, selectedStrategy);
        });

        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('input-screen').classList.remove('hidden');
            document.getElementById('preview-screen').classList.add('hidden');
        });

        document.getElementById('print-btn').addEventListener('click', () => window.print());

        function generateTemplate(teacher, subject, strategyId) {
            const names = {
                '1': 'حل المشكلات (بالمنظم)',
                '2': 'التعلم التعاوني',
                '3': 'العصف الذهني',
                '4': 'الاستقصاء',
                '5': 'قراءة الصور'
            };
            document.getElementById('tmpl-strategy-name').textContent = 'استراتيجية ' + names[strategyId];
            document.getElementById('tmpl-teacher').textContent = teacher;
            document.getElementById('tmpl-subject').textContent = subject;

            const now = new Date();
            const hijriFormatter = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { day:'numeric', month:'long', year:'numeric' });
            document.getElementById('tmpl-date').textContent = hijriFormatter.format(now);

            const content = document.getElementById('tmpl-content');
            content.innerHTML = getStrategyHTML(strategyId);

            document.getElementById('input-screen').classList.add('hidden');
            document.getElementById('preview-screen').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function getStrategyHTML(id) {
            if (id === '1') return `
                <h3 class="font-bold text-teal-700 mb-3">🧩 نموذج حل المشكلات بالمنظم</h3>
                <table class="w-full border-collapse border border-gray-300 text-sm">
                    <thead><tr class="bg-teal-50">
                        <th class="border border-gray-300 p-3 w-1/4">المشكلة</th>
                        <th class="border border-gray-300 p-3 w-1/4">الأسباب المحتملة</th>
                        <th class="border border-gray-300 p-3 w-1/4">الحلول المقترحة</th>
                        <th class="border border-gray-300 p-3 w-1/4">الحل الأفضل ولماذا؟</th>
                    </tr></thead>
                    <tbody>
                        ${Array(3).fill('<tr>' + Array(4).fill('<td class="border border-gray-300 p-3 h-24 align-top"></td>').join('') + '</tr>').join('')}
                    </tbody>
                </table>`;

            if (id === '2') return `
                <h3 class="font-bold text-teal-700 mb-3">👥 نموذج التعلم التعاوني</h3>
                <p class="text-sm text-gray-600 mb-4">اسم المجموعة: ................................</p>
                <table class="w-full border-collapse border border-gray-300 text-sm">
                    <thead><tr class="bg-teal-50">
                        <th class="border border-gray-300 p-3">الدور</th>
                        <th class="border border-gray-300 p-3">اسم الطالبة</th>
                        <th class="border border-gray-300 p-3">المهمة</th>
                        <th class="border border-gray-300 p-3">الإنجاز</th>
                    </tr></thead>
                    <tbody>
                        ${[['القائدة','تدير النقاش وتنظم العمل'],['الكاتبة','تدوّن الأفكار والنتائج'],['المتحدثة','تعرض عمل المجموعة'],['الباحثة','تجمع المعلومات والمصادر']].map(([role,task]) =>
                        `<tr><td class="border border-gray-300 p-3 font-semibold bg-teal-50/50">${role}</td><td class="border border-gray-300 p-3 h-12"></td><td class="border border-gray-300 p-3 text-gray-500 text-xs">${task}</td><td class="border border-gray-300 p-3"></td></tr>`).join('')}
                    </tbody>
                </table>
                <div class="mt-4 border border-gray-300 rounded-lg p-4">
                    <p class="font-semibold text-sm mb-2">ملخص عمل المجموعة:</p>
                    <div class="space-y-3">${Array(3).fill('<div class="write-line"></div>').join('')}</div>
                </div>`;

            if (id === '3') return `
                <h3 class="font-bold text-teal-700 mb-3">💡 العصف الذهني — أفكار خارج الصندوق</h3>
                <div class="border-2 border-dashed border-teal-300 rounded-2xl p-6 text-center mb-4">
                    <p class="text-sm text-gray-500 mb-1">السؤال المطروح / الموضوع:</p>
                    <div class="write-line mx-auto max-w-md mt-2"></div>
                </div>
                <div class="flex flex-wrap justify-center gap-4 my-6">
                    ${Array(8).fill('<div class="bubble">فكرة</div>').join('')}
                </div>
                <div class="border border-gray-300 rounded-lg p-4 mt-4">
                    <p class="font-semibold text-sm mb-2">✨ أفضل فكرة تم اختيارها:</p>
                    <div class="write-line"></div>
                    <p class="font-semibold text-sm mb-2 mt-4">السبب:</p>
                    <div class="write-line"></div>
                </div>`;

            if (id === '4') return `
                <h3 class="font-bold text-teal-700 mb-3">🔍 نموذج الاستقصاء</h3>
                ${[
                    ['#0d9488','١','السؤال','ما السؤال الذي نريد الإجابة عنه؟'],
                    ['#0891b2','٢','الفرضية','ماذا أتوقع أن يحدث؟'],
                    ['#7c3aed','٣','التجربة / البحث','ما الخطوات التي سأتبعها؟'],
                    ['#db2777','٤','النتائج','ماذا لاحظت / وجدت؟'],
                    ['#ea580c','٥','الاستنتاج','ماذا تعلمت؟ هل تحققت فرضيتي؟']
                ].map(([color,num,title,hint]) => `
                <div class="flex gap-4 items-start mb-5">
                    <div class="step-circle" style="background:${color}">${num}</div>
                    <div class="flex-1">
                        <p class="font-bold text-sm mb-1">${title}</p>
                        <p class="text-xs text-gray-400 mb-2">${hint}</p>
                        <div class="space-y-2">${Array(2).fill('<div class="write-line"></div>').join('')}</div>
                    </div>
                </div>`).join('')}`;

            if (id === '5') return `
                <h3 class="font-bold text-teal-700 mb-3">🖼️ نموذج قراءة الصور</h3>
                <div class="border-2 border-dashed border-gray-300 rounded-xl h-48 flex items-center justify-center text-gray-400 mb-6">
                    <span>📷 مكان لصق الصورة</span>
                </div>
                ${[
                    ['ماذا أرى في الصورة؟','صف ما تراه بدقة'],
                    ['ماذا أستنتج؟','ما المعاني أو الأفكار التي تستخلصها؟'],
                    ['ماذا أتساءل؟','ما الأسئلة التي تدور في ذهنك؟']
                ].map(([q, hint]) => `
                <div class="mb-5 border border-gray-200 rounded-xl p-4">
                    <p class="font-bold text-teal-700 mb-1">${q}</p>
                    <p class="text-xs text-gray-400 mb-2">${hint}</p>
                    <div class="space-y-2">${Array(3).fill('<div class="write-line"></div>').join('')}</div>
                </div>`).join('')}`;
        }

        lucide.createIcons();
    </script>

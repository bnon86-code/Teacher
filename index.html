  <script src="/_sdk/c6bcadf20ce5820f.editing_sdk.js" integrity="sha512-LVukVCTKnKSxy98w+wCVzDAxVXBG2vy32XblXlmJD9CPFnF2/FVc75CFngl41IdXcX3sVHJc9olw64zrPM/FIA=="></script>
  <script>
        lucide.createIcons();

        let chosenStrategy = '';

        function selectStrategy(el) {
            document.querySelectorAll('.strategy-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            chosenStrategy = el.dataset.strategy;
            document.getElementById('selected-strategy').value = chosenStrategy;
            document.getElementById('form-error').classList.add('hidden');
        }

        document.getElementById('teacher-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!chosenStrategy) {
                document.getElementById('form-error').classList.remove('hidden');
                return;
            }
            const name = document.getElementById('teacher-name').value;
            const stage = document.getElementById('stage-select').value;
            const grade = document.getElementById('grade-select').value;

            // Fill template
            document.getElementById('tpl-teacher').textContent = name;
            document.getElementById('tpl-stage').textContent = stage;
            document.getElementById('tpl-grade').textContent = grade;
            document.getElementById('tpl-strategy-name').textContent = chosenStrategy;

            // Date
            const now = new Date();
            const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
            document.getElementById('tpl-day').textContent = 'اليوم: ' + days[now.getDay()];
            document.getElementById('tpl-date').textContent = 'التاريخ: ' + now.toLocaleDateString('ar-SA', {year:'numeric',month:'long',day:'numeric'});

            // Render strategy content
            renderStrategy(chosenStrategy);

            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('template-section').classList.remove('hidden');
            lucide.createIcons();
        });

        function goBack() {
            document.getElementById('template-section').classList.add('hidden');
            document.getElementById('form-section').classList.remove('hidden');
        }

        function renderStrategy(name) {
            const container = document.getElementById('strategy-content');
            let html = '';

            if (name === 'حل المشكلات بالمنظم') {
                html = `
                <table class="w-full border-collapse text-sm">
                    <tr><td class="border-2 border-cyan-700 bg-cyan-700 text-white font-bold p-3 text-center" colspan="2">حل المشكلات بالمنظم</td></tr>
                    <tr><td class="border-2 border-cyan-600 bg-cyan-50 font-semibold p-2 w-1/3">١. تحديد المشكلة</td><td class="border-2 border-cyan-600 p-2"><div class="dotted-line"></div><div class="dotted-line mt-2"></div></td></tr>
                    <tr><td class="border-2 border-cyan-600 bg-cyan-50 font-semibold p-2">٢. جمع المعلومات</td><td class="border-2 border-cyan-600 p-2"><div class="dotted-line"></div><div class="dotted-line mt-2"></div></td></tr>
                    <tr><td class="border-2 border-cyan-600 bg-cyan-50 font-semibold p-2">٣. اقتراح الحلول</td><td class="border-2 border-cyan-600 p-2"><div class="dotted-line"></div><div class="dotted-line mt-2"></div></td></tr>
                    <tr><td class="border-2 border-cyan-600 bg-cyan-50 font-semibold p-2">٤. تقييم الحلول</td><td class="border-2 border-cyan-600 p-2"><div class="dotted-line"></div><div class="dotted-line mt-2"></div></td></tr>
                    <tr><td class="border-2 border-cyan-600 bg-cyan-50 font-semibold p-2">٥. الحل الأفضل</td><td class="border-2 border-cyan-600 p-2"><div class="dotted-line"></div><div class="dotted-line mt-2"></div></td></tr>
                </table>`;
            } else if (name === 'التعلم التعاوني') {
                html = `
                <div class="text-center text-sm text-gray-500 mb-3">حددي دورك في المجموعة واكتبي مهامك</div>
                <div class="grid grid-cols-2 gap-4">
                    ${['القائدة 👑','الكاتبة ✍️','المتحدثة 🎤','الميقاتية ⏱️'].map(role => `
                    <div class="border-2 border-cyan-600 rounded-xl p-3">
                        <div class="bg-cyan-700 text-white text-center rounded-lg py-1 font-bold mb-2">${role}</div>
                        <p class="text-xs text-gray-500 mb-1">الاسم:</p><div class="dotted-line"></div>
                        <p class="text-xs text-gray-500 mb-1 mt-2">المهام:</p><div class="dotted-line"></div><div class="dotted-line mt-1"></div>
                    </div>`).join('')}
                </div>
                <div class="border-2 border-cyan-600 rounded-xl p-3 mt-4">
                    <div class="bg-cyan-700 text-white text-center rounded-lg py-1 font-bold mb-2">ملخص عمل المجموعة</div>
                    <div class="dotted-line"></div><div class="dotted-line mt-2"></div><div class="dotted-line mt-2"></div>
                </div>`;
            } else if (name === 'العصف الذهني') {
                html = `
                <div class="text-center text-sm text-gray-500 mb-3">اكتبي أفكارك خارج الصندوق! 💡</div>
                <div class="flex justify-center mb-4">
                    <div class="border-4 border-cyan-700 rounded-2xl px-8 py-4 bg-cyan-50 font-bold text-cyan-800 text-lg">الفكرة الرئيسية<div class="dotted-line mt-1"></div></div>
                </div>
                <div class="flex flex-wrap justify-center gap-3">
                    ${[1,2,3,4,5,6].map(i => `<div class="bubble">فكرة ${i}</div>`).join('')}
                </div>
                <div class="mt-4 border-2 border-cyan-600 rounded-xl p-3">
                    <div class="font-semibold text-cyan-800 mb-2">✨ أفضل فكرة وسبب اختيارها:</div>
                    <div class="dotted-line"></div><div class="dotted-line mt-2"></div>
                </div>`;
            } else if (name === 'الاستقصاء') {
                html = `
                <div class="space-y-3">
                    ${[
                        {n:'١',t:'السؤال / المشكلة',icon:'❓'},
                        {n:'٢',t:'الفرضية (توقعي)',icon:'🤔'},
                        {n:'٣',t:'جمع البيانات والأدلة',icon:'📊'},
                        {n:'٤',t:'التحليل والتفسير',icon:'🔬'},
                        {n:'٥',t:'النتيجة والاستنتاج',icon:'✅'}
                    ].map(s => `
                    <div class="step-box">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="bg-cyan-700 text-white w-7 h-7 rounded-full flex items-center justify-center text-sm font-bold">${s.n}</span>
                            <span class="font-semibold text-cyan-800">${s.icon} ${s.t}</span>
                        </div>
                        <div class="dotted-line"></div><div class="dotted-line mt-1"></div>
                    </div>`).join('')}
                </div>`;
            } else if (name === 'قراءة الصور') {
                html = `
                <div class="border-2 border-cyan-600 rounded-xl p-3 mb-4">
                    <div class="bg-gray-100 border-2 border-dashed border-gray-300 rounded-xl h-40 flex items-center justify-center text-gray-400 text-lg">📷 الصق الصورة هنا</div>
                </div>
                <div class="space-y-3">
                    ${[
                        {q:'ماذا تشاهدين في الصورة؟', icon:'👁️'},
                        {q:'ما الألوان والأشكال البارزة؟', icon:'🎨'},
                        {q:'ما الرسالة التي توصلها الصورة؟', icon:'💭'},
                        {q:'ما علاقة الصورة بالدرس؟', icon:'🔗'},
                        {q:'رأيك الشخصي في الصورة:', icon:'⭐'}
                    ].map(item => `
                    <div class="step-box">
                        <p class="font-semibold text-cyan-800 mb-1">${item.icon} ${item.q}</p>
                        <div class="dotted-line"></div><div class="dotted-line mt-1"></div>
                    </div>`).join('')}
                </div>`;
            }
            container.innerHTML = html;
        }
    </script>
